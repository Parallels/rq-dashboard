{% extends "rq_dashboard/base.html" %}

{% block content %}
<div class="section">
    <div class="row">
        <span class="col-10">
            <h2><strong>Job ID</strong>: {{ id }}</h2>
        </span>

        <span class="col-2">
            <button id="requeue-job-btn" class="btn btn-outline-warning btn-sm" style="display: none">Requeue</button>
            {% if enable_delete %}
            <button id="delete-job-btn" class="btn btn-outline-danger btn-sm">Delete</button>
            {% endif %}
        </span>
    </div>
    <div id="job-data" class="row"></div>


    <script name="job-info" type="text/template">

        <span class="col-6">
            <p class="ellipsify"><strong>Description</strong>:<br><%= $('<div/>').text(d.description).html() %></p>
            <p><strong>Origin queue</strong>:<br><%= $('<div/>').text(d.origin).html() %></p>
            <p><strong>Status</strong>:<br><%= $('<div/>').text(d.status).html() %></p>
            <% if (d.result) { %>
            <p><strong>Result</strong>:<br><%= $('<div/>').text(d.result).html() %></p>
            <% } %>
        </span>

        <span class="col-6">
            <p><strong>Created at</strong>:<br> <%= d.created_at %></p>
            <p><strong>Enqueued at</strong>:<br> <%= d.enqueued_at %></p>
            <% if (d.exc_info) { %>
            <p><strong>Ended at</strong>:<br> <%= d.ended_at %></p>
            <% } %>
        </span>

        <% if (d.exc_info) { %>
        <div class = "row col-12">
            <pre class="exc_info col-12"><%= $('<div/>').text(d.exc_info).html() %></pre>
        </div>
        <% } %>
    </script>
</div>

{% endblock %}

{% block content_scripts %}
    {% include "rq_dashboard/scripts/job.js" %}
{% endblock %}
